{% extends "base.html" %}

{% block title %}Импорт проекта — Paperbird{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-8 col-xl-7">
      <div class="mb-4">
        <h1 class="h3 mb-1">Импорт проекта</h1>
        <p class="text-muted mb-0">
          Загрузите JSON/YAML экспорт проекта. Посты и медиа не импортируются.
        </p>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <form method="post" enctype="multipart/form-data" novalidate>
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label" for="project_file">Файл экспорта</label>
              <input class="form-control" type="file" id="project_file" name="project_file" accept=".json,.yml,.yaml" />
              <div class="form-text">Поддерживаются .json, .yml, .yaml.</div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="project_payload">Или вставьте JSON/YAML</label>
              <textarea class="form-control" id="project_payload" name="project_payload" rows="8" placeholder="{ ... }"></textarea>
            </div>
            <div class="d-flex justify-content-between">
              <a class="btn btn-outline-secondary" href="{% url 'projects:list' %}">Назад</a>
              <button class="btn btn-primary" type="submit">Импортировать</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
