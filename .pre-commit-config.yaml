repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: check-yaml

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          [
            "--baseline",
            ".secrets.baseline",
            "--exclude-files",
            "(^|.*/)src/.*/tests?/|(^|.*/)infra/.env.example$",
          ]

  - repo: local
    hooks:
      - id: forbid-sensitive-files
        name: forbid-sensitive-files
        entry: python tools/forbid_sensitive_files.py
        language: python
        pass_filenames: true
