version: "3.9"

x-app-base: &app-base
  build:
    context: ..
    dockerfile: infra/Dockerfile
  restart: unless-stopped
  env_file:
    - ./.env
  volumes:
    - ..:/app
  depends_on:
    postgres:
      condition: service_healthy
    watercrawl:
      condition: service_started
  environment:
    POSTGRES_HOST: postgres
    WATERCRAWL_API_URL: ${WATERCRAWL_API_URL:-http://watercrawl:8080/crawl}
    WATERCRAWL_API_KEY: ${WATERCRAWL_API_KEY:-}
    WATERCRAWL_TIMEOUT_SEC: ${WATERCRAWL_TIMEOUT_SEC:-30}
  networks:
    - paperbird-internal

services:
  postgres:
    image: postgres:16
    container_name: paperbird-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperbird}
      POSTGRES_USER: ${POSTGRES_USER:-paperbird}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperbird}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paperbird}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - paperbird-internal

  watercrawl:
    image: ${WATERCRAWL_IMAGE:-watercrawl/watercrawl:latest}
    container_name: paperbird-watercrawl
    restart: unless-stopped
    environment:
      PORT: ${WATERCRAWL_PORT:-8080}
    expose:
      - "${WATERCRAWL_PORT:-8080}"
    networks:
      - paperbird-internal

  paperbird:
    <<: *app-base
    container_name: paperbird-app
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      RUN_MIGRATIONS: "1"
    ports:
      - "8000:8000"

  collectors:
    <<: *app-base
    container_name: paperbird-collector
    profiles: ["workers"]
    command:
      - python
      - manage.py
      - run_worker
      - collector
      - "--sleep=${COLLECTOR_SLEEP:-5}"
    environment:
      RUN_MIGRATIONS: "0"

  collectors_web:
    <<: *app-base
    container_name: paperbird-collector-web
    profiles: ["workers"]
    command:
      - python
      - manage.py
      - run_worker
      - collector_web
      - "--sleep=${COLLECTOR_WEB_SLEEP:-30}"
    environment:
      RUN_MIGRATIONS: "0"

volumes:
  postgres-data:
    name: paperbird-postgres-data

networks:
  paperbird-internal:
    name: paperbird-internal
